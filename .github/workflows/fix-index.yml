name: Fix Index & Deploy（一次性补索引）

# 用途：上一轮全量构建已编译出包（artifact 内），但 SDK 的 usign/apk 被 cp 破坏
#       动态链接导致索引/签名/密钥未生成。本工作流手动触发：
#       下载 artifact → 下载 SDK（仅取 host 工具）→ 生成索引+签名+密钥 → 推送 gh-pages。
# 之后的全量构建不再需要它（build-packages.yml 已修复）。

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: sjg-fix-index
  cancel-in-progress: false

jobs:
  fix-index:
    name: 补齐索引与签名并推送 gh-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 下载构建产物（curl + API，含诊断）
        run: |
          set -e
          mkdir -p merged
          TOKEN="${{ github.token }}"
          for a in repo-opkg repo-apk; do
            echo "==> 查找 artifact: $a"
            RESP="$(curl -s -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?name=$a&per_page=1")"
            echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print('   API 找到:', [x['name'] for x in d.get('artifacts',[])])" 2>/dev/null || { echo "   API 响应异常: ${RESP:0:200}"; exit 1; }
            ID="$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['artifacts'][0]['id'] if d.get('artifacts') else '')")"
            [ -n "$ID" ] || { echo "!! 找不到 $a（GITHUB_TOKEN 权限或 artifact 缺失）"; exit 1; }
            echo "   id=$ID，下载中..."
            curl -sL -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ID/zip" -o "$a.zip"
            ls -la "$a.zip"
            unzip -q "$a.zip" -d merged
            echo "   已解压 $a"
          done
          echo "--- merged 顶层 ---"
          ls -la merged/
          echo "--- merged/repo ---"
          ls merged/repo/ 2>/dev/null || true

      - name: 下载 SDK（仅取 host 工具，不重编译）
        run: |
          cd "$GITHUB_WORKSPACE"
          for u in \
            "https://dl.wrt.moe/releases/24.10.6/targets/x86/64/immortalwrt-sdk-24.10.6-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst" \
            "https://dl.wrt.moe/releases/25.12.2/targets/x86/64/immortalwrt-sdk-25.12.2-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst" ; do
            f="$(basename "$u")"
            [ -f "$f" ] || wget -q --tries=3 "$u" -O "$f" || curl -fsSL --retry 3 "$u" -o "$f"
            tar --zstd -xf "$f"
          done
          echo "SDK 目录: $(find . -maxdepth 1 -type d -name '*sdk*' | tr '\n' ' ')"

      - name: 生成 opkg 索引与签名（复用 gen-index.sh，SDK 原始工具；同时产出签名密钥）
        run: |
          set -e
          ROOT="$PWD"
          echo "==> opkg 索引"
          bash scripts/gen-index.sh opkg "$ROOT/merged/repo/opkg/x86_64" "$ROOT/merged/keys" "$ROOT"
          echo "==> opkg 产物"
          ls -la merged/repo/opkg/x86_64/Packages* 2>/dev/null || true
          ls -la merged/keys/ 2>/dev/null || true

      - name: 生成 apk 索引 packages.adb 与签名（编译完整 apk-tools 3.0.5）
        run: |
          set -e
          ROOT="$PWD"
          APKS_DIR="$ROOT/merged/repo/apk/x86_64"
          [ -d "$APKS_DIR" ] || { echo "!! 无 apk 包目录 $APKS_DIR"; exit 1; }
          [ -f "$ROOT/merged/keys/secret.key" ] || { echo "!! 无签名密钥，先跑 opkg 索引步骤生成"; exit 1; }
          # v3 源的索引文件名是 packages.adb（不是 APKINDEX.tar.gz）。
          # 包格式为 apk-tools 3 的 ADB 格式；SDK/固件内的 apk 是 minimal 裁剪版（无 index 命令）。
          # 直接取与 ImmortalWrt 25.12.2 完全同源（package/system/apk 的 PKG_SOURCE_VERSION=b5a31c0d = 3.0.5）
          # 的 apk-tools 源码（Alpine GitLab 官方源在 GitHub Actions 上被 418 拦截，
          # 改用 Alpine 官方 GitHub mirror alpinelinux/apk-tools），meson 编译完整版（非 minimal、带 index）——几分钟完成。
          sudo apt-get update && sudo apt-get install -y meson ninja-build lua5.1 liblua5.1-0-dev libssl-dev zlib1g-dev pkg-config
          mkdir -p /tmp/apk-tools
          curl -fSL -L "https://codeload.github.com/alpinelinux/apk-tools/tar.gz/b5a31c0d865342ad80be10d68f1bb3d3ad9b0866" -o /tmp/apk-tools.tar.gz
          tar -xzf /tmp/apk-tools.tar.gz -C /tmp/apk-tools --strip-components=1
          cd /tmp/apk-tools
          meson setup build -Ddocs=disabled -Dhelp=enabled -Dlua_version=5.1 -Ddefault_library=static -Durl_backend=wget -Dzstd=disabled -Dpython=disabled -Dtests=disabled -Dcrypto_backend=openssl
          ninja -C build
          APK_HOST="$(find /tmp/apk-tools/build -maxdepth 3 -name apk -type f | head -n1)"
          [ -n "$APK_HOST" ] || { echo "!! 未找到编译产物 apk"; exit 1; }
          echo "==> 完整 host apk: $APK_HOST"
          "$APK_HOST" --version
          cd "$APKS_DIR"
          "$APK_HOST" index --allow-untrusted --output packages.adb ./*.apk
          ls -la packages.adb
          # usign 签名（SDK 原始路径，勿 cp；usign 默认输出 <msg>.sig，无 -o 选项）
          SDK25="$(find "$ROOT" -maxdepth 1 -type d -name '*sdk*25.12*' | head -n1)"
          USIGN="$SDK25/staging_dir/host/bin/usign"
          "$USIGN" -S -m packages.adb -s "$ROOT/merged/keys/secret.key"
          echo "==> apk 产物"
          ls -la packages.adb packages.adb.sig

      - name: 合并并推送 gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ROOT="$PWD"
          git config user.name "sjg-packages-bot"
          git config user.email "actions@github.com"
          # 用 worktree 避免与工作区未跟踪文件（merged/、SDK 目录）冲突
          git fetch origin gh-pages --depth 1 || true
          git worktree add /tmp/gh-pages-wt gh-pages 2>/dev/null || git worktree add /tmp/gh-pages-wt --orphan gh-pages 2>/dev/null || true
          cd /tmp/gh-pages-wt
          rm -rf apk opkg keys .nojekyll
          cp -r "$ROOT/merged/repo/"* .
          if [ -d "$ROOT/merged/keys" ]; then cp -r "$ROOT/merged/keys" .; fi
          touch .nojekyll
          echo "--- 发布内容预览（前 30 文件） ---"
          find apk opkg keys -type f 2>/dev/null | head -n 30
          git add -A
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "fix: 补齐索引与签名 $(date -u +%F-%H%M)"
            git push origin gh-pages
          fi
          cd "$ROOT"
          git worktree remove /tmp/gh-pages-wt --force 2>/dev/null || true
