name: Fix Index & Deploy（一次性补索引）

# 用途：上一轮全量构建已编译出包（artifact 内），但 SDK 的 usign/apk 被 cp 破坏
#       动态链接导致索引/签名/密钥未生成。本工作流手动触发：
#       下载 artifact → 下载 SDK（仅取 host 工具）→ 生成索引+签名+密钥 → 推送 gh-pages。
# 之后的全量构建不再需要它（build-packages.yml 已修复）。

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: sjg-fix-index
  cancel-in-progress: false

jobs:
  fix-index:
    name: 补齐索引与签名并推送 gh-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 下载构建产物（curl + API，含诊断）
        run: |
          set -e
          mkdir -p merged
          TOKEN="${{ github.token }}"
          for a in repo-opkg repo-apk; do
            echo "==> 查找 artifact: $a"
            RESP="$(curl -s -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?name=$a&per_page=1")"
            echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print('   API 找到:', [x['name'] for x in d.get('artifacts',[])])" 2>/dev/null || { echo "   API 响应异常: ${RESP:0:200}"; exit 1; }
            ID="$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['artifacts'][0]['id'] if d.get('artifacts') else '')")"
            [ -n "$ID" ] || { echo "!! 找不到 $a（GITHUB_TOKEN 权限或 artifact 缺失）"; exit 1; }
            echo "   id=$ID，下载中..."
            curl -sL -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ID/zip" -o "$a.zip"
            ls -la "$a.zip"
            unzip -q "$a.zip" -d merged
            echo "   已解压 $a"
          done
          echo "--- merged 顶层 ---"
          ls -la merged/
          echo "--- merged/repo ---"
          ls merged/repo/ 2>/dev/null || true

      - name: 下载 SDK（仅取 host 工具，不重编译）
        run: |
          cd "$GITHUB_WORKSPACE"
          for u in \
            "https://dl.wrt.moe/releases/24.10.6/targets/x86/64/immortalwrt-sdk-24.10.6-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst" \
            "https://dl.wrt.moe/releases/25.12.2/targets/x86/64/immortalwrt-sdk-25.12.2-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst" ; do
            f="$(basename "$u")"
            [ -f "$f" ] || wget -q --tries=3 "$u" -O "$f" || curl -fsSL --retry 3 "$u" -o "$f"
            tar --zstd -xf "$f"
          done
          echo "SDK 目录: $(find . -maxdepth 1 -type d -name '*sdk*' | tr '\n' ' ')"

      - name: 下载 apk-tools-static（完整 apk，SDK host apk 无 index 功能）
        run: |
          set -e
          PKG="$(curl -s "https://dl-cdn.alpinelinux.org/alpine/v3.20/main/x86_64/" | grep -o 'apk-tools-static-[0-9.]*-r[0-9]*\.apk' | sort -V | tail -1)"
          echo "apk-tools-static: $PKG"
          [ -n "$PKG" ] || { echo "!! 未找到 apk-tools-static"; exit 1; }
          wget -q "https://dl-cdn.alpinelinux.org/alpine/v3.20/main/x86_64/$PKG" -O /tmp/apk-static.apk
          mkdir -p /tmp/sbin
          tar -xzf /tmp/apk-static.apk -C /tmp sbin/apk.static
          /tmp/sbin/apk.static --version

      - name: 提取 apk-tools v3（官方 rootfs 基系统组件，与 25.12 完全匹配）
        run: |
          set -e
          wget -q "https://dl.wrt.moe/releases/25.12.2/targets/x86/64/immortalwrt-25.12.2-x86-64-generic-ext4-rootfs.img.gz" -O /tmp/rootfs.img.gz
          gunzip -f /tmp/rootfs.img.gz
          sudo mkdir -p /mnt/sjg-rootfs
          sudo mount -o loop /tmp/rootfs.img /mnt/sjg-rootfs
          BIN="$(sudo find /mnt/sjg-rootfs -type f \( -name 'apk-tools' -o -name 'apk' \) 2>/dev/null | head -n1)"
          echo "rootfs 内 apk 工具: $BIN"
          [ -n "$BIN" ] || { echo "!! rootfs 未找到 apk-tools"; sudo find /mnt/sjg-rootfs -name '*apk*' 2>/dev/null | head; exit 1; }
          REL="$(echo "$BIN" | sed 's|/mnt/sjg-rootfs/||')"
          sudo mkdir -p /tmp/apkroot
          sudo tar -C /mnt/sjg-rootfs -cf - "$REL" 2>/dev/null | sudo tar -C /tmp/apkroot -xf -
          # 动态链接依赖（libapk/musl/ssl，若存在）
          sudo tar -C /mnt/sjg-rootfs -cf - usr/lib/libapk* lib/ld-musl* usr/lib/libcrypto* usr/lib/libssl* 2>/dev/null | sudo tar -C /tmp/apkroot -xf - || true
          sudo umount /mnt/sjg-rootfs
          sudo rm -rf /mnt/sjg-rootfs
          sudo chmod -R +x /tmp/apkroot
          B="/tmp/apkroot/$REL"
          echo "提取到: $B"
          if "$B" --version 2>/dev/null; then
            echo "apk-tools 可直接运行"
            cp "$B" /tmp/apk-run
          else
            echo "动态链接，用 SDK musl loader + LD_LIBRARY_PATH 包装"
            SDK25="$(find . -maxdepth 1 -type d -name '*sdk*25.12*' | head -n1)"
            LDR="$(find "$SDK25" -path '*toolchain*' -name 'ld-musl-*.so.1' | head -n1)"
            [ -n "$LDR" ] || { echo "!! 未找到 musl loader"; exit 1; }
            printf '#!/bin/sh\nexport LD_LIBRARY_PATH="/tmp/apkroot/usr/lib:/tmp/apkroot/lib:$LD_LIBRARY_PATH"\nexec "%s" "%s" "$@"\n' "$LDR" "$B" > /tmp/apk-run
            chmod +x /tmp/apk-run
            /tmp/apk-run --version
          fi

      - name: 生成索引与签名（复用 gen-index.sh，SDK 原始工具）
        run: |
          set -e
          ROOT="$PWD"
          echo "==> opkg 索引"
          bash scripts/gen-index.sh opkg "$ROOT/merged/repo/opkg/x86_64" "$ROOT/merged/keys" "$ROOT"
          echo "==> apk 索引"
          bash scripts/gen-index.sh apk "$ROOT/merged/repo/apk/x86_64" "$ROOT/merged/keys" "$ROOT"
          echo "==> 产物清单"
          ls -la merged/repo/opkg/x86_64/Packages* 2>/dev/null || true
          ls -la merged/repo/apk/x86_64/APKINDEX* 2>/dev/null || true
          ls -la merged/keys/ 2>/dev/null || true

      - name: 合并并推送 gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ROOT="$PWD"
          git config user.name "sjg-packages-bot"
          git config user.email "actions@github.com"
          # 用 worktree 避免与工作区未跟踪文件（merged/、SDK 目录）冲突
          git fetch origin gh-pages --depth 1 || true
          git worktree add /tmp/gh-pages-wt gh-pages 2>/dev/null || git worktree add /tmp/gh-pages-wt --orphan gh-pages 2>/dev/null || true
          cd /tmp/gh-pages-wt
          rm -rf apk opkg keys .nojekyll
          cp -r "$ROOT/merged/repo/"* .
          if [ -d "$ROOT/merged/keys" ]; then cp -r "$ROOT/merged/keys" .; fi
          touch .nojekyll
          echo "--- 发布内容预览（前 30 文件） ---"
          find apk opkg keys -type f 2>/dev/null | head -n 30
          git add -A
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "fix: 补齐索引与签名 $(date -u +%F-%H%M)"
            git push origin gh-pages
          fi
          cd "$ROOT"
          git worktree remove /tmp/gh-pages-wt --force 2>/dev/null || true
