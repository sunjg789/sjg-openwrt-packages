name: Fix Index & Deploy（一次性补索引）

# 用途：上一轮全量构建已编译出包（artifact 内），但 SDK 的 usign/apk 被 cp 破坏
#       动态链接导致索引/签名/密钥未生成。本工作流手动触发：
#       下载 artifact → 下载 SDK（仅取 host 工具）→ 生成索引+签名+密钥 → 推送 gh-pages。
# 之后的全量构建不再需要它（build-packages.yml 已修复）。

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read   # download-artifact 需要读取 Actions 产物

concurrency:
  group: sjg-fix-index
  cancel-in-progress: false

jobs:
  fix-index:
    name: 补齐索引与签名并推送 gh-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          pattern: repo-*
          merge-multiple: true
          path: merged
          # 下载来源：指定全量构建那一轮的 artifact（download-artifact 默认只取当前 run）
          run-id: 36134915068

      - name: 下载 SDK（仅取 host 工具，不重编译）
        run: |
          cd "$GITHUB_WORKSPACE"
          for u in \
            "https://dl.wrt.moe/releases/24.10.6/targets/x86/64/immortalwrt-sdk-24.10.6-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst" \
            "https://dl.wrt.moe/releases/25.12.2/targets/x86/64/immortalwrt-sdk-25.12.2-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst" ; do
            f="$(basename "$u")"
            [ -f "$f" ] || wget -q --tries=3 "$u" -O "$f" || curl -fsSL --retry 3 "$u" -o "$f"
            tar --zstd -xf "$f"
          done
          echo "SDK 目录: $(find . -maxdepth 1 -type d -name '*sdk*' | tr '\n' ' ')"

      - name: 生成索引与签名（复用 gen-index.sh，SDK 原始工具）
        run: |
          set -e
          ROOT="$PWD"
          echo "==> opkg 索引"
          bash scripts/gen-index.sh opkg "$ROOT/merged/repo/opkg/x86_64" "$ROOT/merged/keys" "$ROOT"
          echo "==> apk 索引"
          bash scripts/gen-index.sh apk "$ROOT/merged/repo/apk/x86_64" "$ROOT/merged/keys" "$ROOT"
          echo "==> 产物清单"
          ls -la merged/repo/opkg/x86_64/Packages* 2>/dev/null || true
          ls -la merged/repo/apk/x86_64/APKINDEX* 2>/dev/null || true
          ls -la merged/keys/ 2>/dev/null || true

      - name: 合并并推送 gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "sjg-packages-bot"
          git config user.email "actions@github.com"
          git fetch origin gh-pages --depth 1 || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
          fi
          rm -rf apk opkg keys .nojekyll
          cp -r merged/repo/* .
          if [ -d merged/keys ]; then cp -r merged/keys .; fi
          touch .nojekyll
          echo "--- 发布内容预览（前 40 文件） ---"
          find apk opkg keys -type f 2>/dev/null | head -n 40
          git add -A
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "fix: 补齐索引与签名 $(date -u +%F-%H%M)"
            git push origin gh-pages
          fi
