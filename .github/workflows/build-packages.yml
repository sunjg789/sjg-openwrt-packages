name: Build SJG Plugin Repo

on:
  workflow_dispatch:          # 手动触发：仓库 Actions 页点 Run workflow
  schedule:
    - cron: '0 2 * * 1'       # 每周一 02:00 UTC（自动更新到插件上游最新）
  push:
    paths:
      - 'plugins.conf'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: write
  actions: read   # deploy 的 download-artifact 需要读取 Actions 产物

concurrency:
  group: sjg-packages
  cancel-in-progress: false

jobs:
  # ============ 编译：apk 系（25.12.2）与 opkg 系（24.10.6）并行 ============
  build:
    name: Build ${{ matrix.fmt }} (${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fmt: opkg
            version: '24.10.6'
            sdk: https://dl.wrt.moe/releases/24.10.6/targets/x86/64/immortalwrt-sdk-24.10.6-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
          - fmt: apk
            version: '25.12.2'
            sdk: https://dl.wrt.moe/releases/25.12.2/targets/x86/64/immortalwrt-sdk-25.12.2-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
    steps:
      - uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential zstd wget git file gawk gettext \
            python3 unzip rsync patch diffutils cpio perl \
            libncurses5-dev zlib1g-dev libssl-dev

      - name: 复用既有签名密钥（首次为空则构建时自动生成）
        run: |
          git fetch origin gh-pages --depth 1 2>/dev/null || true
          git checkout gh-pages -- keys/ 2>/dev/null || true
          ls keys/ 2>/dev/null || echo "无既有密钥，将由 gen-index.sh 自动生成"

      - name: 编译插件包（SDK + 收录清单）
        run: |
          bash scripts/fetch-and-build.sh "${{ matrix.sdk }}" \
            "$PWD/repo/${{ matrix.fmt }}/x86_64" "$PWD/plugins.conf"
        timeout-minutes: 360

      - name: chroot 生成 apk 索引与签名（官方 rootfs 完整环境，v3 格式匹配）
        if: matrix.fmt == 'apk'
        run: |
          set -e
          ROOT="$PWD"
          APKS_DIR="$ROOT/repo/apk/x86_64"
          [ -d "$APKS_DIR" ] || { echo "!! 无 apk 包目录 $APKS_DIR"; exit 1; }
          [ -f "$ROOT/keys/secret.key" ] || { echo "!! 无签名密钥"; exit 1; }
          # rootfs 的 apk-tools 3.0.5 是 OpenWrt 裁剪版（无 index 命令）——
          # 改用 Alpine 官方静态 apk-tools v3（完整版，含 index；包格式同为 v3）
          for BASE in "v3.22" "v3.21" "edge"; do
            PKG="$(curl -s "https://dl-cdn.alpinelinux.org/alpine/$BASE/main/x86_64/" | grep -o 'apk-tools-static-[0-9a-z._]*\.apk' | sort -V | tail -1)"
            [ -n "$PKG" ] || continue
            wget -q "https://dl-cdn.alpinelinux.org/alpine/$BASE/main/x86_64/$PKG" -O /tmp/apk-static.apk
            mkdir -p /tmp/sbin
            tar -xzf /tmp/apk-static.apk -C /tmp sbin/apk.static
            VER="$(/tmp/sbin/apk.static --version 2>&1 | head -1)"
            echo "==> $BASE: $PKG -> $VER"
            case "$VER" in *3.*) echo "==> v3 OK"; break;; *) echo "==> 非 v3，继续探测";; esac
          done
          /tmp/sbin/apk.static --version
          cd "$APKS_DIR"
          /tmp/sbin/apk.static --allow-untrusted index -o APKINDEX.tar.gz ./*.apk
          ls -la APKINDEX.tar.gz
          # 用 SDK usign 签名（SDK 原始路径，勿 cp；usign 默认输出 <msg>.sig，无 -o 选项）
          SDK25="$(find "$ROOT" -maxdepth 1 -type d -name '*sdk*25.12*' | head -n1)"
          USIGN="$SDK25/staging_dir/host/bin/usign"
          "$USIGN" -S -m APKINDEX.tar.gz -s "$ROOT/keys/secret.key"
          echo "==> apk 产物"
          ls -la APKINDEX.tar.gz APKINDEX.tar.gz.sig

      - name: 生成索引与签名（opkg 走 gen-index.sh，SDK 原始工具）
        if: matrix.fmt == 'opkg'
        run: |
          # 注：SDK 的 usign 是动态链接（依赖 SDK 内 staging_dir/host/lib），
          # 不能 cp 到 /usr/local/bin（会破坏 ld 路径）；gen-index.sh 直接调用 SDK 原始路径。
          bash scripts/gen-index.sh opkg \
            "$PWD/repo/opkg/x86_64" "$PWD/keys" "$PWD"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: repo-${{ matrix.fmt }}
          path: |
            repo/
            keys/
          retention-days: 7

  # ============ 发布：合并 apk/opkg/keys 推送到 gh-pages（GitHub Pages 源） ============
  deploy:
    name: Deploy to gh-pages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          pattern: repo-*
          merge-multiple: true
          path: merged

      - name: 合并并推送 gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "sjg-packages-bot"
          git config user.email "actions@github.com"
          git fetch origin gh-pages --depth 1 || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
          fi
          rm -rf apk opkg keys .nojekyll
          cp -r merged/repo/* .
          if [ -d merged/keys ]; then cp -r merged/keys .; fi
          touch .nojekyll
          echo "--- 发布内容预览 ---"
          find apk opkg keys -type f 2>/dev/null | head -n 60
          git add -A
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "build: update packages $(date -u +%F)"
            git push origin gh-pages
          fi
