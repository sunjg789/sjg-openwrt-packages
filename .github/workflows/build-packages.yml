name: Build SJG Plugin Repo

on:
  workflow_dispatch:          # 手动触发：仓库 Actions 页点 Run workflow
  schedule:
    - cron: '0 2 * * 1'       # 每周一 02:00 UTC（自动更新到插件上游最新）
  push:
    paths:
      - 'plugins.conf'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: write
  actions: read   # deploy 的 download-artifact 需要读取 Actions 产物

concurrency:
  group: sjg-packages
  cancel-in-progress: false

jobs:
  # ============ 编译：apk 系（25.12.2）与 opkg 系（24.10.6）并行 ============
  build:
    name: Build ${{ matrix.fmt }} (${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fmt: opkg
            version: '24.10.6'
            sdk: https://dl.wrt.moe/releases/24.10.6/targets/x86/64/immortalwrt-sdk-24.10.6-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
          - fmt: apk
            version: '25.12.2'
            sdk: https://dl.wrt.moe/releases/25.12.2/targets/x86/64/immortalwrt-sdk-25.12.2-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
    steps:
      - uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential zstd wget git file gawk gettext \
            python3 unzip rsync patch diffutils cpio perl \
            libncurses5-dev zlib1g-dev libssl-dev

      - name: 复用既有签名密钥（首次为空则构建时自动生成）
        run: |
          git fetch origin gh-pages --depth 1 2>/dev/null || true
          git checkout gh-pages -- keys/ 2>/dev/null || true
          ls keys/ 2>/dev/null || echo "无既有密钥，将由 gen-index.sh 自动生成"

      - name: 编译插件包（SDK + 收录清单）
        run: |
          bash scripts/fetch-and-build.sh "${{ matrix.sdk }}" \
            "$PWD/repo/${{ matrix.fmt }}/x86_64" "$PWD/plugins.conf"
        timeout-minutes: 360

      - name: 编译 apk-tools v3（挂载 openwrt/apk-tools 源码为本地 feed）
        if: matrix.fmt == 'apk'
        run: |
          set -e
          SDK25="$(find . -maxdepth 1 -type d -name '*sdk*25.12*' | head -n1)"
          echo "SDK25: $SDK25"
          cd "$SDK25"
          make defconfig >/tmp/defconfig.log 2>&1 || { echo "!! defconfig 失败"; tail -n 15 /tmp/defconfig.log; exit 1; }
          git clone --depth 1 https://github.com/openwrt/apk-tools.git /tmp/apk-tools-src
          mkdir -p feeds/custom
          cp -r /tmp/apk-tools-src feeds/custom/apk-tools
          grep -q "^src-link custom" feeds.conf.default || echo "src-link custom $PWD/feeds/custom" >> feeds.conf.default
          ./scripts/feeds update custom >/tmp/feeds-update.log 2>&1 || { tail -n 15 /tmp/feeds-update.log; exit 1; }
          ./scripts/feeds install apk-tools >/tmp/feeds-install.log 2>&1 || { tail -n 15 /tmp/feeds-install.log; exit 1; }
          make package/apk-tools/compile V=s >/tmp/apktools-build.log 2>&1 \
            || { echo "!! apk-tools 编译失败"; tail -n 25 /tmp/apktools-build.log; exit 1; }
          PKG="$(find bin/packages -name 'apk-tools_*.apk' | head -n1)"
          echo "apk-tools 包: $PKG"
          [ -n "$PKG" ] || { echo "!! 未找到 apk-tools 包"; exit 1; }
          mkdir -p /tmp/apktools-extract
          tar -xzf "$PKG" -C /tmp/apktools-extract
          BIN="$(find /tmp/apktools-extract -type f -name 'apk-tools' | head -n1)"
          echo "二进制: $BIN"
          [ -n "$BIN" ] || { find /tmp/apktools-extract -type f | head; exit 1; }
          chmod +x "$BIN"
          if "$BIN" --version 2>/dev/null; then
            echo "apk-tools 可直接运行"
            cp "$BIN" /tmp/apk-run
          else
            echo "动态链接，用 SDK musl loader 包装"
            LDR="$(find "$PWD" -path '*toolchain*' -name 'ld-musl-*.so.1' | head -n1)"
            [ -n "$LDR" ] || { echo "!! 未找到 musl loader"; exit 1; }
            printf '#!/bin/sh\nexec "%s" "%s" "$@"\n' "$LDR" "$BIN" > /tmp/apk-run
            chmod +x /tmp/apk-run
            /tmp/apk-run --version
          fi

      - name: 生成索引与签名
        run: |
          # 注：SDK 的 usign/apk 是动态链接（依赖 SDK 内 staging_dir/host/lib），
          # 不能 cp 到 /usr/local/bin（会破坏 ld 路径）；gen-index.sh 直接调用 SDK 原始路径。
          bash scripts/gen-index.sh "${{ matrix.fmt }}" \
            "$PWD/repo/${{ matrix.fmt }}/x86_64" "$PWD/keys" "$PWD"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: repo-${{ matrix.fmt }}
          path: |
            repo/
            keys/
          retention-days: 7

  # ============ 发布：合并 apk/opkg/keys 推送到 gh-pages（GitHub Pages 源） ============
  deploy:
    name: Deploy to gh-pages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          pattern: repo-*
          merge-multiple: true
          path: merged

      - name: 合并并推送 gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "sjg-packages-bot"
          git config user.email "actions@github.com"
          git fetch origin gh-pages --depth 1 || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
          fi
          rm -rf apk opkg keys .nojekyll
          cp -r merged/repo/* .
          if [ -d merged/keys ]; then cp -r merged/keys .; fi
          touch .nojekyll
          echo "--- 发布内容预览 ---"
          find apk opkg keys -type f 2>/dev/null | head -n 60
          git add -A
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "build: update packages $(date -u +%F)"
            git push origin gh-pages
          fi
