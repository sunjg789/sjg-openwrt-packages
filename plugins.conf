# ============================================================
# SJG OpenWrt 插件库 · 收录清单
# ------------------------------------------------------------
# 格式（管道符分隔，4 列）：
#   目录名 | 上游仓库 URL | 编译目标 | 说明
#
# 上游仓库 URL 取值：
#   - GitHub/gitee 仓库地址：按目录名 clone 该仓库源码到 package/
#   - `SMALLPKG`            ：从 kenzok8/small-package 源码合集稀疏拉取
#                              （目录名可逗号分隔多个：前端包 + 同仓依赖内核包）
#
# 编译目标说明：
#   - `-`                  ：只克隆源码，不单独编译（依赖会被自动解析编译）
#   - `包目录名`           ：make package/<包目录名>/compile（编译整个目录）
#   - `包目录名/子包`      ：make package/<包目录名>/<子包>/compile（只编单个包）
#
# 收录原则：聚焦“非官方源 / 官方源更新慢 / 国内可访问性差”的第三方热门插件；
# 官方源已内置的插件（vlmcsd、ramfree、arpbind、ttyd、docker、wireguard、
# luci-ssl、luci-app-taskbot、luci-app-commands、luci-app-adguardhome 等）
# 无需收录，直接走官方源即可。
# 参考：https://github.com/kenzok8/small-package（热门源码合集，2026-09 对齐）
# ============================================================

PLUGINS=(
  # ---------------- 独立上游（逐项 clone） ----------------
  # 目录 | 上游仓库 | 编译目标 | 说明
  "OpenClash|https://github.com/vernesong/OpenClash.git|OpenClash|Clash 内核客户端（热门，含 luci-app-openclash）"
  "passwall|https://github.com/Openwrt-Passwall/openwrt-passwall.git|passwall|PassWall 科学上网（依赖自动解析）"
  "passwall2|https://github.com/Openwrt-Passwall/openwrt-passwall2.git|passwall2|PassWall2 科学上网（新一代）"
  "passwall-packages|https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git|-|PassWall 依赖库（chinadns-ng/xray/sing-box 等，仅克隆）"
  "lucky|https://github.com/gdy666/lucky.git|lucky|Lucky 网络工具集（含 lucky + luci-app-lucky）"
  "argon|https://github.com/jerrykuku/luci-theme-argon.git|argon|Argon 主题 + luci-app-argon-config"
  "adguardhome|https://github.com/rufengsuixing/luci-app-adguardhome.git|adguardhome|AdGuardHome 插件（AdGuardHome 主程序运行后手动下载）"
  # 注：oaf（OpenAppFilter）未收录 —— 上游 kmod-oaf 包存在 Kconfig 递归依赖
  #     （PACKAGE_kmod-oaf selected by PACKAGE_kmod-oaf），会破坏整个 SDK 的配置生成。
  "diskman|https://github.com/lisaac/luci-app-diskman.git|luci-app-diskman|磁盘管理"
  "dockerman|https://github.com/lisaac/luci-app-dockerman.git|luci-app-dockerman|Docker 管理"
  "unblockneteasemusic|https://github.com/UnblockNeteaseMusic/luci-app-unblockneteasemusic.git|unblockneteasemusic|解锁网易云音乐"

  # ---------------- small-package 源码合集（稀疏拉取） ----------------
  # 目录（可多，逗号分隔） | SMALLPKG | 编译目标 | 说明
  "luci-app-homeproxy|SMALLPKG|luci-app-homeproxy|HomeProxy 代理（ImmortalWrt 官方）"
  "luci-app-nikki,sing-box|SMALLPKG|luci-app-nikki|Nikki 代理（sing-box 内核）"
  "luci-app-fchomo,mihomo|SMALLPKG|luci-app-fchomo|mihomo 前端（Clash Meta）"
  "luci-app-v2raya,v2raya|SMALLPKG|luci-app-v2raya|v2rayA 客户端"
  "luci-app-mosdns,mosdns|SMALLPKG|luci-app-mosdns|mosdns 本地 DNS（AdGuard 分流）"
  # 注：luci-app-smartdns 未收录 —— 25.12 SDK 上其依赖的 rust 工具链编译超过单包超时上限
  #     （官方源已有 smartdns，需要时直接走官方源）。
  "luci-app-dnsproxy,dnsproxy|SMALLPKG|luci-app-dnsproxy|dnsproxy（AdGuard DNS 代理）"
  # 注：alist（luci-app-alist, alist）未收录 —— 编译时其 Kconfig 出现
  #     PACKAGE_luci-app-alist 递归自依赖（间歇性破坏 SDK 配置生成，与 oaf 同类），
  #     需要可在源码全编译时加入。
  "luci-app-aria2,aria2|SMALLPKG|luci-app-aria2|Aria2 下载"
  "luci-app-filebrowser,filebrowser|SMALLPKG|luci-app-filebrowser|FileBrowser 文件管理"
  "luci-app-transmission,transmission|SMALLPKG|luci-app-transmission|Transmission BT 下载"
  "luci-app-gost,gost|SMALLPKG|luci-app-gost|GOST 隧道/端口转发"
  "luci-app-udp2raw,udp2raw|SMALLPKG|luci-app-udp2raw|udp2raw 隧道（伪装 UDP）"
  "luci-app-socat|SMALLPKG|luci-app-socat|socat 端口转发（依赖官方源 socat）"
  "luci-app-natmap,openwrt-natmap|SMALLPKG|luci-app-natmap|NATMap 公网端口映射"
  "luci-app-npc|SMALLPKG|luci-app-npc|NPC 内网穿透"
  "luci-app-ddns-go,ddns-go|SMALLPKG|luci-app-ddns-go|DDNS-GO 动态域名"
  "luci-app-netdata,netdata|SMALLPKG|luci-app-netdata|NetData 实时监控"
  "luci-app-partexp|SMALLPKG|luci-app-partexp|分区扩展（partexp）"
  "luci-app-autoreboot|SMALLPKG|luci-app-autoreboot|定时重启"
  "luci-app-poweroff|SMALLPKG|luci-app-poweroff|定时关机"
  "luci-app-advanced|SMALLPKG|luci-app-advanced|高级设置（简化复杂配置）"
  "luci-app-wolplus|SMALLPKG|luci-app-wolplus|网络唤醒 WOL Plus"
  # 注：luci-theme-design 未收录 —— SMALLPKG 上游版本号格式不合法（apk 打包报
  #     "package version is invalid"），需要时可从官方源安装。
  "luci-theme-edge|SMALLPKG|luci-theme-edge|Edge 主题"
)
